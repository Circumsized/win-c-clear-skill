name: Feature request
description: Suggest a new cleanup target, rule set, or capability
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! For new cleanup targets, please provide evidence the target is regenerable.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: |
        For a new cleanup target, include: id, name, path (env-var form), proposed tier, and why it is safe at that tier.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Area
      options:
        - New cleanup target
        - Rule data / rule set
        - Engine / scanning
        - Safety / guardrails
        - Documentation
        - Other
