name: Bug report
description: Report a bug or unexpected behavior in win-c-clear-skill
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Since this skill deletes files, please be precise.
        **If this is a safety vulnerability (protected-path bypass, deletion without confirmation), do NOT file a public issue — see [SECURITY.md](../SECURITY.md).**
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: |
        Minimal steps or command to reproduce. Prefer `-DryRun` reproductions.
        **Never include a real destructive reproduction.**
      placeholder: |
        1. powershell -File scripts\Invoke-CDriveCleanup.ps1 -Mode Scan ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: json-summary
    attributes:
      label: JSON_SUMMARY output
      description: Paste the `JSON_SUMMARY_BEGIN ... JSON_SUMMARY_END` block if relevant (redact personal paths).
      render: json
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 23H2 (build 22631)
    validations:
      required: true
  - type: dropdown
    id: context
    attributes:
      label: How were you running it?
      options:
        - Agent (Claude Code / codex / Trae / Cursor / DeepSeek Harness)
        - Standalone PowerShell
        - Double-click .bat entry
        - Other
    validations:
      required: true
